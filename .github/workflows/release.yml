name: Release

# Runs when a GitHub release is published, and only then: the image is
# published from releases, never from every push. Cut a release with
#
#   gh release create vX.Y.Z --target main --title vX.Y.Z --notes ""
#
# from a commit on main whose server/Cargo.toml version is X.Y.Z and whose
# CHANGELOG.md has a `## X.Y.Z` entry. This workflow checks both, runs CI,
# publishes the image, and fills empty release notes from the changelog.

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/agnt5dev/agnt5-runtime

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag, version and changelog agree
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' server/Cargo.toml)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::server/Cargo.toml version must be X.Y.Z, found '$version'"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match server/Cargo.toml version v$version"
            exit 1
          fi
          if [ "$PRERELEASE" = true ]; then
            echo "::error::a prerelease would move the latest tag; publish $TAG as a full release"
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' entry"
            exit 1
          fi
          # Releases come from main, so every release has passed CI there.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the image
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the published binary
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$REF"
          docker run --rm --entrypoint sh "$REF" -c \
            'cd /usr/local/bin && sha256sum -c /usr/local/share/agnt5/agnt5-runtime.sha256'
          reported=$(docker run --rm "$REF" --version)
          if [ "$reported" != "agnt5-runtime $VERSION" ]; then
            echo "::error::the image reports '$reported', expected 'agnt5-runtime $VERSION'"
            exit 1
          fi

      - name: Fill empty release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -n "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            exit 0
          fi
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### agnt5-runtime $VERSION"
            while read -r tag; do
              [ -n "$tag" ] && echo "- \`$tag\`"
            done <<< "$TAGS"
            echo "- digest \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
