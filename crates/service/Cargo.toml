[package]
name = "engine-service"
publish = false
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
description = "Shared AGNT5 engine API and pull-worker service"

[dependencies]
runtime-common = { workspace = true }
engine-proto = { workspace = true }
engine-core = { workspace = true }
engine-cache = { workspace = true }
engine-processor = { workspace = true }

tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
opentelemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
default = []

[dev-dependencies]
engine-processor = { workspace = true, features = [] }
tempfile = { workspace = true }
prost-types = { workspace = true }
